<!doctype html>
<html lang="pt-BR">
   <head>
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <title>Jogo da Memória</title>
      <link rel="preconnect" href="https://googleapis.com" />
      <link rel="preconnect" href="https://gstatic.com" crossorigin />
      <link
         href="https://googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&family=Righteous&display=swap"
         rel="stylesheet"
      />
      <link rel="stylesheet" href="./assets/css/style.css" />
   </head>
   <body>
      <main class="container">
         <h1>Jogo da Memória</h1>
         <section
            id="gameBoard"
            aria-label="Tabuleiro do Jogo da Memória"
         ></section>
      </main>

      <div
         id="gameOver"
         role="dialog"
         aria-modal="true"
         aria-labelledby="gameOverTitle"
      >
         <h2 id="gameOverTitle">Parabéns, você completou o jogo!</h2>
         <button id="restart" type="button">Reiniciar o jogo</button>
      </div>

      <footer>Criado por Dev. Rafael Santana</footer>

      <script src="./assets/js/game.js"></script>
      <script src="./assets/js/script.js"></script>
   </body>
</html>
